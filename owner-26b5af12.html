<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>

*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}

<script>
var $=function(i){return document.getElementById(i)};

var KEY=location.hash=="#go";try{if(KEY)sessionStorage.setItem("ok","1");else KEY=sessionStorage.getItem("ok")=="1"}catch(e){}
if(!KEY)nf();
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ms(t){return t&&t.toMillis?t.toMillis():(t||0)}
function fmt(t){var m=ms(t);return m?new Date(m).toLocaleString("en-IN",{timeZone:"Asia/Kolkata",day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:true}):"-"}
function dur(a,b){a=ms(a);b=ms(b);if(!a||!b||b<a)return "-";var s=Math.round((b-a)/1000);return s<60?s+" sec":Math.floor(s/60)+" min "+(s%60)+" sec"}
if(!window.ATOZ_FIREBASE||!ATOZ_FIREBASE.apiKey){$("err").textContent="Not configured.";$("in").disabled=true}
else{firebase.initializeApp(ATOZ_FIREBASE);var auth=firebase.auth(),db=firebase.firestore();
$("in").onclick=function(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){$("err").textContent=e.message})};

var D={cust:[],sess:[],ev:[]},tab="over";
/* ---- Manage: add items, weekend offers, banner ---- */
var CATS={"Home Appliances":["Kitchenware & Appliances","Table & Ceiling Fans","Water Heaters & Geysers","Iron Boxes","Home Safes & Lockers"],"Toys & Games":["Toys","Indoor Games","Cricket","Outdoor Sports"],"School Essentials":["Tiffins & Bottles","Pouches & Bags"],"Decor Items":["Wall Decor","Lights & Candles","Showpieces & Vases","Home Furnishing"],"Plastic Items":["Storage Containers","Buckets & Tubs","Kitchen & Dining","Chairs & Tables","Household Basics"]};
var MAXB=20000;
D.items=[];D.offers=[];D.flash=null;
function shrink(file){return new Promise(function(res,rej){
if(!file||!/^image\//.test(file.type))return rej(new Error("Please choose an image file."));
var u=URL.createObjectURL(file),im=new Image();
im.onerror=function(){URL.revokeObjectURL(u);rej(new Error("Could not read that image."))};
im.onload=function(){URL.revokeObjectURL(u);var side=480,q=.82;
function go(){var r=Math.min(1,side/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*r)),h=Math.max(1,Math.round(im.height*r)),c=document.createElement("canvas");c.width=w;c.height=h;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
c.toBlob(function(b){if(!b)return rej(new Error("Image conversion failed."));
if(b.size<=MAXB){var fr=new FileReader();fr.onload=function(){res({url:fr.result,bytes:b.size,w:w,h:h})};fr.readAsDataURL(b);return}
if(q>.42)q-=.08;else{side=Math.round(side*.85);q=.7}
if(side<90)return rej(new Error("Could not get this image under 20 KB. Try a simpler photo."));go()},"image/jpeg",q)}
go()};im.src=u})}
function F(id){return $(id)}
function msgSet(id,t,ok){var e=$(id);if(e){e.textContent=t;e.style.color=ok?"#0e7a4b":"#b3261e"}}
function manHtml(){
var co=Object.keys(CATS).map(function(c){return'<option>'+esc(c)+'</option>'}).join("");
var h='<h3>Add a new item</h3><div class="box" style="padding:14px"><div class="fg">'

+'<label>Sub-category *<select id="mSub"><option value="">Select category first</option></select></label>'

+'<label>Offer price (Rs) *<input id="oPrice" type="number" min="1"></label><label>MRP (Rs)<input id="oMrp" type="number" min="0"></label>'

+'<label>Photo * (auto-compressed under 20 KB)<input id="oImg" type="file" accept="image/*"></label></div>'

+'<h3>Weekend offers added ('+D.offers.length+')</h3>'+tbl(["Photo","Product","Price","Ends",""],D.offers.map(function(o){return'<tr><td><img src="'+esc(o.img||"")+'" style="width:44px;height:44px;object-fit:cover;border-radius:4px"></td><td>'+esc(o.brand+" "+o.name)+'</td><td>Rs '+esc(o.price)+(o.mrp?" (MRP "+esc(o.mrp)+")":"")+'</td><td>'+esc(fmt(o.endsAt))+(o.endsAt<Date.now()?" (ended)":"")+'</td><td><button data-delo="'+o.id+'" class="g2">Delete</button></td></tr>'}))
+'<p class="note">Items show on the website at the top of their sub-category under "New arrivals". Photos are shrunk automatically to 20 KB or less. Built-in catalogue items cannot be edited here.</p>';
return h}
function bindMan(){
var cat=F("mCat"),sub=F("mSub");
cat.onchange=function(){var l=CATS[cat.value]||[];sub.innerHTML=l.length?'<option value="">Select sub-category</option>'+l.map(function(s){return'<option>'+esc(s)+'</option>'}).join(""):'<option value="">Select category first</option>'};
function prev(inp,out,key){inp.onchange=function(){F(out).textContent="";P[key]=null;if(!inp.files[0])return;F(out).textContent="Compressing...";shrink(inp.files[0]).then(function(r){P[key]=r;F(out).innerHTML='<img src="'+r.url+'" style="width:90px;height:90px;object-fit:cover;border-radius:6px;vertical-align:middle"> '+Math.round(r.bytes/102.4)/10+' KB, '+r.w+'x'+r.h+' - OK'}).catch(function(e){F(out).textContent=e.message;inp.value=""})}}
var P={m:null,o:null};prev(F("mImg"),"mPrev","m");prev(F("oImg"),"oPrev","o");
F("mAdd").onclick=function(){var n=F("mName").value.trim(),i=F("mInfo").value.trim();
if(!cat.value)return msgSet("mMsg","Choose a category.");if(!sub.value)return msgSet("mMsg","Choose a sub-category.");

if(!P.m)return msgSet("mMsg","A photo is required.");
F("mAdd").disabled=true;msgSet("mMsg","Saving...",1);
db.collection("catalog_items").add({cat:cat.value,sub:sub.value,name:n,spec:i,tag:F("mTag").value,img:P.m.url,hidden:false,createdAt:Date.now()}).then(function(){msgSet("mMsg","Added. It is live on the website.",1);reload()}).catch(function(e){F("mAdd").disabled=false;msgSet("mMsg","Not saved: "+e.message)})};
F("oAdd").onclick=function(){var n=F("oName").value.trim(),b=F("oBrand").value.trim(),pr=Number(F("oPrice").value),mr=Number(F("oMrp").value)||0,e=Date.parse(F("oEnd").value);

if(!e||e<=Date.now())return msgSet("oMsg","Choose a future end date and time.");if(!P.o)return msgSet("oMsg","A photo is required.");
F("oAdd").disabled=true;msgSet("oMsg","Saving...",1);
db.collection("flash_offers").add({name:n,brand:b,price:pr,mrp:mr,note:F("oNote").value.trim(),img:P.o.url,endsAt:e,createdAt:Date.now()}).then(function(){msgSet("oMsg","Added to Weekend Offers.",1);reload()}).catch(function(e2){F("oAdd").disabled=false;msgSet("oMsg","Not saved: "+e2.message)})};
function ban(on){var t=F("bTxt").value.trim();if(on&&!t)return msgSet("bMsg","Type the message.");var e=Date.parse(F("bEnd").value)||0;
db.collection("site").doc("flash").set({active:on,text:t,endsAt:e,updatedAt:Date.now()}).then(function(){msgSet("bMsg",on?"Banner is on.":"Banner is off.",1)}).catch(function(x){msgSet("bMsg","Not saved: "+x.message)})}
F("bOn").onclick=function(){ban(true)};F("bOff").onclick=function(){ban(false)};
document.querySelectorAll("[data-hid]").forEach(function(b){b.onclick=function(){var x=D.items.filter(function(i){return i.id==b.dataset.hid})[0];db.collection("catalog_items").doc(b.dataset.hid).update({hidden:!x.hidden}).then(reload)}});
document.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){if(confirm("Delete this item?"))db.collection("catalog_items").doc(b.dataset.del).delete().then(reload)}});
document.querySelectorAll("[data-delo]").forEach(function(b){b.onclick=function(){if(confirm("Delete this offer?"))db.collection("flash_offers").doc(b.dataset.delo).delete().then(reload)}})}
function reload(){loadExtra().then(draw)}
function loadExtra(){var m=function(d){return Object.assign({id:d.id},d.data())};
return Promise.all([db.collection("catalog_items").get().catch(function(){return null}),db.collection("flash_offers").get().catch(function(){return null}),db.collection("site").doc("flash").get().catch(function(){return null})]).then(function(r){
D.items=r[0]?r[0].docs.map(m).sort(function(a,b){return b.createdAt-a.createdAt}):[];D.offers=r[1]?r[1].docs.map(m).sort(function(a,b){return b.createdAt-a.createdAt}):[];D.flash=r[2]&&r[2].exists?r[2].data():null})}

function load(){$("m").innerHTML='<div class="msg">Loading data...</div>';
Promise.all([db.collection("customers").get(),db.collection("sessions").orderBy("startedAt","desc").limit(500).get(),db.collection("events").orderBy("ts","desc").limit(3000).get()]).then(function(r){
D.cust=r[0].docs.map(function(d){return Object.assign({id:d.id},d.data())});D.sess=r[1].docs.map(function(d){return d.data()});D.ev=r[2].docs.map(function(d){return d.data()});loadExtra().then(draw)})
.catch(function(e){auth.signOut().then(nf)})}
function T(e){return ms(e.ts)||e.clientTs||0}
function custs(){var m={},ev=D.ev.slice().sort(function(a,b){return T(a)-T(b)});
function get(p,n){var x=m[p];if(!x)x=m[p]={phone:p,name:n||"",email:"",address:"",logins:0,logouts:0,views:0,wish:0,orders:0,first:0,last:0};if(n)x.name=n;return x}
ev.forEach(function(e){if(!e.phone)return;var x=get(e.phone,e.name),t=T(e);if(!x.first)x.first=t;x.last=Math.max(x.last,t);
if(e.type=="login"){x.logins++;if(e.email)x.email=e.email;if(e.address)x.address=e.address}
else if(e.type=="logout")x.logouts++;else if(e.type=="item_view")x.views++;else if(e.type=="wishlist_add")x.wish++;else if(e.type=="order_placed")x.orders++});
D.cust.forEach(function(c){if(!c.phone)return;var x=get(c.phone,c.name);if(!x.email)x.email=c.email||"";if(!x.address)x.address=c.address||"";var t=ms(c.lastLoginAt);if(!x.first)x.first=t;x.last=Math.max(x.last,t);if(!x.logins)x.logins=c.loginCount||1});
return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.last-a.last})}
function items(){var o={};D.ev.forEach(function(e){if(!e.item)return;var x=o[e.item]||(o[e.item]={n:e.itemName,c:e.category,v:0,w:0,o:0,u:{}});
if(e.type=="item_view"){x.v++;x.u[e.phone||e.uid]=1}else if(e.type=="wishlist_add")x.w++;else if(e.type=="order_click")x.o++});
